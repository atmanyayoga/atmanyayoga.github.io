<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Ātmanya Yoga Trishul mark">
  <defs>
    <linearGradient id="maroon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a12020"/>
      <stop offset="100%" stop-color="#6b1f1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7b86a"/>
      <stop offset="100%" stop-color="#b8923d"/>
    </linearGradient>
  </defs>
  <g transform="translate(64,64)">
    <circle cx="0" cy="0" r="58" fill="url(#maroon)"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#f8f0e8" stroke-opacity="0.35" stroke-width="2"/>
    <!-- Trishul -->
    <g stroke="#f8f0e8" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- center shaft -->
      <path d="M0 -34 V28"/>
      <!-- top spear -->
      <path d="M0 -42 L-4 -32 L0 -34 L4 -32 Z" fill="#f8f0e8" stroke="none"/>
      <!-- left prong -->
      <path d="M-18 -18 C-18 -30 -8 -34 0 -30"/>
      <path d="M-18 -18 L-22 -26 L-14 -24" />
      <!-- right prong -->
      <path d="M18 -18 C18 -30 8 -34 0 -30"/>
      <path d="M18 -18 L22 -26 L14 -24" />
      <!-- cross bar -->
      <path d="M-14 -8 H14"/>
      <!-- damaru dots -->
      <circle cx="-10" cy="-2" r="1.6" fill="url(#gold)" stroke="none"/>
      <circle cx="10" cy="-2" r="1.6" fill="url(#gold)" stroke="none"/>
      <!-- base -->
      <path d="M-8 28 H8"/>
      <path d="M0 28 V38"/>
      <path d="M-10 38 H10"/>
    </g>
    <circle cx="0" cy="-12" r="3" fill="url(#gold)" stroke="none"/>
  </g>
</svg>
