<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">Ātmanya Yoga</title>
  <desc id="desc">Ātmanya Yoga logo with Trishul mark and wordmark</desc>
  <defs>
    <linearGradient id="maroon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a12020"/>
      <stop offset="100%" stop-color="#6b1f1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7b86a"/>
      <stop offset="100%" stop-color="#b8923d"/>
    </linearGradient>
  </defs>

  <!-- Trishul mark -->
  <g transform="translate(100,92)">
    <circle cx="0" cy="0" r="62" fill="url(#maroon)"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#f8f0e8" stroke-opacity="0.35" stroke-width="2"/>
    <g stroke="#f8f0e8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M0 -36 V30"/>
      <path d="M0 -45 L-4.5 -34 L0 -36 L4.5 -34 Z" fill="#f8f0e8" stroke="none"/>
      <path d="M-20 -18 C-20 -31 -9 -36 0 -31"/>
      <path d="M-20 -18 L-24 -27 L-15 -24"/>
      <path d="M20 -18 C20 -31 9 -36 0 -31"/>
      <path d="M20 -18 L24 -27 L15 -24"/>
      <path d="M-15 -7 H15"/>
      <circle cx="-11" cy="-1" r="1.8" fill="url(#gold)" stroke="none"/>
      <circle cx="11" cy="-1" r="1.8" fill="url(#gold)" stroke="none"/>
      <path d="M-9 30 H9"/>
      <path d="M0 30 V40"/>
      <path d="M-11 40 H11"/>
    </g>
    <circle cx="0" cy="-12" r="3.2" fill="url(#gold)" stroke="none"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(190,88)">
    <text x="0" y="0" font-family="'Cormorant Garamond', Georgia, serif" font-size="78" font-weight="700" fill="#5a1714" letter-spacing="1">Ātmanya Yoga</text>
    <text x="4" y="44" font-family="'Outfit', Arial, sans-serif" font-size="24" font-weight="600" fill="#7a1616" letter-spacing="6">MOVEMENT TO STILLNESS</text>
  </g>
</svg>
